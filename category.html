<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Shop - SHOP.CO</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <div id="header"></div>

    <main class="category-page">
      <section class="category-header">
        <div class="container">
          <div class="category-breadcrumb">
            <a href="index.html">Home</a>
            <i class="bi bi-chevron-right" aria-hidden="true"></i>
            <span id="category-breadcrumb">Shop</span>
          </div>

          <div
            class="d-flex flex-column flex-md-row justify-content-between align-items-md-end gap-3"
          >
            <div>
              <h1 id="category-title">Shop</h1>

              <p id="product-count" class="mb-0">Loading products...</p>
            </div>

            <div class="sort-box">
              <label for="sort-products">Sort by:</label>

              <select id="sort-products" class="form-select">
                <option value="popular">Most Popular</option>
                <option value="rating">Top Rated</option>
                <option value="price-low">Price: Low to High</option>
                <option value="price-high">Price: High to Low</option>
              </select>
            </div>
          </div>
        </div>
      </section>

      <section class="category-products-section">
        <div class="container">
          <div class="d-md-none mb-3">
            <button type="button" id="open-filters" class="btn btn-dark w-100">
              <i class="bi bi-sliders me-2" aria-hidden="true"></i>
              Filters
            </button>
          </div>

          <div class="row g-4">
            <aside class="col-md-3">
              <div class="filters">
                <div
                  class="filter-header d-flex justify-content-between align-items-center"
                >
                  <h2 class="mb-0">Filters</h2>

                  <button
                    type="button"
                    class="filter-close d-md-none"
                    aria-label="Close filters"
                  >
                    <i class="bi bi-x-lg" aria-hidden="true"></i>
                  </button>
                </div>

                <hr />

                <div class="filter-group">
                  <h3>Categories</h3>
                  <div id="category-filters" class="filter-list"></div>
                </div>

                <hr />

                <div class="filter-group">
                  <h3>Price</h3>

                  <input
                    type="range"
                    id="price-range"
                    class="form-range"
                    min="0"
                    value="0"
                  />

                  <div class="d-flex justify-content-between price-values">
                    <span>$0</span>
                    <span id="max-price">$0</span>
                  </div>
                </div>

                <hr />

                <div class="filter-group">
                  <h3>Colors</h3>
                  <div id="color-filters" class="color-options"></div>
                </div>

                <hr />

                <div class="filter-group">
                  <h3>Size</h3>
                  <div id="size-filters" class="size-options"></div>
                </div>

                <hr />

                <div class="filter-group">
                  <h3>Dress Style</h3>
                  <div id="style-filters" class="filter-list"></div>
                </div>

                <button
                  type="button"
                  id="apply-filters"
                  class="btn btn-dark w-100 mt-3"
                >
                  Apply Filter
                </button>
              </div>
            </aside>

            <div class="col-12 col-md-9">
              <div
                id="category-products"
                class="row row-cols-2 row-cols-lg-3 g-4"
              ></div>

              <div
                class="category-pagination d-flex justify-content-between align-items-center mt-5"
              >
                <button
                  type="button"
                  id="previous-page"
                  class="btn btn-outline-dark"
                >
                  <i class="bi bi-arrow-left me-1" aria-hidden="true"></i>
                  Previous
                </button>

                <div id="pagination-numbers" class="d-flex gap-2"></div>

                <button
                  type="button"
                  id="next-page"
                  class="btn btn-outline-dark"
                >
                  Next
                  <i class="bi bi-arrow-right ms-1" aria-hidden="true"></i>
                </button>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <div id="footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
    <script src="js/category.js"></script>
  </body>
</html>
