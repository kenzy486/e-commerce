    <i class="bi bi-x"></i>
  </button>
</div>

<!-- Header -->
<header class="site-header">
  <nav class="navbar navbar-expand-md">
    <div class="container-fluid">
      <!-- Mobile menu -->
      <button
        class="navbar-toggler d-md-none"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarMenu"
        aria-controls="navbarMenu"
        aria-label="Open menu"
      >
        <i class="bi bi-list"></i>
      </button>

      <!-- Logo -->
      <a href="index.html" class="navbar-brand logo"> SHOP.CO </a>

      <!-- Navigation -->
      <div class="collapse navbar-collapse" id="navbarMenu">
        <ul class="navbar-nav nav-links">
          <li class="nav-item">
            <a class="nav-link" href="category.html"> Shop </a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="category.html?tag=sale"> On Sale </a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="category.html?tag=new"> New Arrivals </a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="category.html"> Brands </a>
          </li>
        </ul>
      </div>

      <!-- Desktop search -->
      <div class="search-box d-none d-md-flex">
        <i class="bi bi-search search-icon" aria-hidden="true"></i>

        <input
          type="search"
          class="search-input"
          placeholder="Search for products..."
          aria-label="Search for products"
        />
      </div>

      <!-- Header icons -->
      <div class="header-icons">
        <!-- Mobile search -->
        <button
          class="icon-button d-md-none"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#mobileSearch"
          aria-controls="mobileSearch"
          aria-label="Search"
        >
          <i class="bi bi-search"></i>
        </button>

        <!-- Account -->
        <a href="#" class="icon-button d-none d-md-flex" aria-label="Account">
          <i class="bi bi-person"></i>
        </a>

        <!-- Cart -->
        <a href="cart.html" class="icon-button" aria-label="Shopping cart">
          <i class="bi bi-cart3"></i>
        </a>
      </div>
    </div>

    <!-- Mobile search -->
    <div class="collapse d-md-none mobile-search" id="mobileSearch">
      <div class="mobile-search-box">
        <i class="bi bi-search search-icon" aria-hidden="true"></i>

        <input
          type="search"
          class="search-input"
          placeholder="Search for products..."
          aria-label="Search for products"
        />
      </div>
    </div>
  </nav>
</header>
