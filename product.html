<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Product - SHOP.CO</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <div id="header"></div>

    <main>
      <section class="product-breadcrumb">
        <div class="container">
          <a href="index.html">Home</a>
          <i class="bi bi-chevron-right" aria-hidden="true"></i>

          <a href="category.html">Shop</a>
          <i class="bi bi-chevron-right" aria-hidden="true"></i>

          <span id="breadcrumb-product">Product</span>
        </div>
      </section>

      <section class="product-details">
        <div class="container">
          <div class="row g-4">
            <div class="col-12 col-lg-7">
              <div class="row g-3">
                <div class="col-3">
                  <div id="product-thumbnails" class="product-thumbnails"></div>
                </div>

                <div class="col-9">
                  <div class="product-main-image">
                    <img src="" alt="Product" id="product-image" />
                  </div>
                </div>
              </div>
            </div>

            <div class="col-12 col-lg-5">
              <div class="product-info">
                <h1 id="product-name">Product Name</h1>

                <div class="product-rating">
                  <div id="product-stars" class="rating-stars"></div>

                  <span id="product-rating">0/5</span>
                </div>

                <div class="product-price">
                  <strong id="product-price">$0</strong>
                  <span id="product-original-price"></span>
                  <span id="product-discount"></span>
                </div>

                <p id="product-description"></p>

                <hr />

                <div class="product-option">
                  <h3>Choose Color</h3>

                  <div id="product-colors" class="color-options"></div>

                  <p id="selected-color" class="small text-muted mt-2 mb-0"></p>
                </div>

                <hr />

                <div class="product-option">
                  <h3>Choose Size</h3>

                  <div id="product-sizes" class="size-options"></div>

                  <p id="selected-size" class="small text-muted mt-2 mb-0"></p>
                </div>

                <hr />

                <div class="product-actions">
                  <div class="quantity-control">
                    <button
                      type="button"
                      id="decrease-quantity"
                      aria-label="Decrease quantity"
                    >
                      <i class="bi bi-dash"></i>
                    </button>

                    <span id="quantity">1</span>

                    <button
                      type="button"
                      id="increase-quantity"
                      aria-label="Increase quantity"
                    >
                      <i class="bi bi-plus"></i>
                    </button>
                  </div>

                  <button
                    type="button"
                    class="btn btn-dark add-cart-button"
                    id="add-to-cart"
                  >
                    Add to Cart
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section class="reviews-section product-reviews">
        <div class="container">
          <div class="d-flex align-items-center justify-content-between mb-4">
            <div class="d-flex align-items-center gap-2">
              <h2 class="mb-0">All Reviews</h2>
              <span id="review-count" class="text-muted"> (0) </span>
            </div>

            <div class="d-flex align-items-center gap-2">
              <button
                type="button"
                class="btn btn-light rounded-circle"
                aria-label="Filter reviews"
              >
                <i class="bi bi-sliders"></i>
              </button>

              <div class="dropdown">
                <button
                  type="button"
                  class="btn btn-light rounded-pill dropdown-toggle"
                  data-bs-toggle="dropdown"
                  aria-expanded="false"
                >
                  Latest
                </button>

                <ul class="dropdown-menu">
                  <li>
                    <button
                      type="button"
                      class="dropdown-item review-sort-option"
                      data-sort="latest"
                    >
                      Latest
                    </button>
                  </li>

                  <li>
                    <button
                      type="button"
                      class="dropdown-item review-sort-option"
                      data-sort="oldest"
                    >
                      Oldest
                    </button>
                  </li>

                  <li>
                    <button
                      type="button"
                      class="dropdown-item review-sort-option"
                      data-sort="highest"
                    >
                      Highest Rating
                    </button>
                  </li>

                  <li>
                    <button
                      type="button"
                      class="dropdown-item review-sort-option"
                      data-sort="lowest"
                    >
                      Lowest Rating
                    </button>
                  </li>
                </ul>
              </div>

              <button
                type="button"
                class="btn btn-dark rounded-pill"
                data-bs-toggle="modal"
                data-bs-target="#reviewModal"
              >
                Write a Review
              </button>
            </div>
          </div>

          <div id="product-reviews" class="row g-3"></div>

          <div class="text-center mt-4">
            <button
              type="button"
              class="btn btn-outline-dark rounded-pill px-5"
              id="load-more-reviews"
            >
              Load More Reviews
            </button>
          </div>
        </div>
      </section>

      <section class="products-section related-products">
        <div class="container">
          <h2 class="section-title">YOU MIGHT ALSO LIKE</h2>

          <div
            id="related-products"
            class="row row-cols-2 row-cols-md-4 g-3"
          ></div>
        </div>
      </section>
    </main>

    <div
      class="modal fade"
      id="reviewModal"
      tabindex="-1"
      aria-labelledby="reviewModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content rounded-4">
          <div class="modal-header">
            <h2 class="modal-title fs-5" id="reviewModalLabel">
              Write a Review
            </h2>

            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>

          <div class="modal-body">
            <form id="review-form">
              <div class="mb-3">
                <label for="review-name" class="form-label"> Your Name </label>

                <input
                  type="text"
                  class="form-control"
                  id="review-name"
                  required
                />
              </div>

              <div class="mb-3">
                <label for="review-rating" class="form-label"> Rating </label>

                <select class="form-select" id="review-rating" required>
                  <option value="">Choose rating</option>
                  <option value="5">★★★★★ - 5</option>
                  <option value="4">★★★★☆ - 4</option>
                  <option value="3">★★★☆☆ - 3</option>
                  <option value="2">★★☆☆☆ - 2</option>
                  <option value="1">★☆☆☆☆ - 1</option>
                </select>
              </div>

              <div class="mb-3">
                <label for="review-text" class="form-label">
                  Your Review
                </label>

                <textarea
                  class="form-control"
                  id="review-text"
                  rows="4"
                  required
                ></textarea>
              </div>

              <button type="submit" class="btn btn-dark w-100 rounded-pill">
                Submit Review
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <div id="footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
    <script src="js/product.js"></script>
  </body>
</html>
